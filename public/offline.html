<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0A2B52" />
    <title>Práxis — sem conexão</title>
    <style>
      :root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F8FAFC;color:#111827;font:16px Inter,system-ui,sans-serif}.card{max-width:460px;padding:34px;border:1px solid #DCE3EC;border-radius:16px;background:#fff;text-align:center;box-shadow:0 12px 34px rgba(4,28,51,.14)}.card img{display:block;width:min(310px,90%);height:130px;margin:0 auto 6px;object-fit:contain}.card h1{font-family:Georgia,serif;font-size:1.55rem;color:#0A2B52}.card p{color:#4B5563;line-height:1.55}.card button{min-height:46px;border:0;border-radius:10px;padding:12px 18px;background:#1769D2;color:white;font-weight:700}@media(prefers-color-scheme:dark){body{background:#071524;color:#F8FAFC}.card{background:#0B1F34;border-color:#24415E}.card h1{color:#F8FAFC}.card p{color:#CBD5E1}}
    </style>
  </head>
  <body>
    <main class="card">
      <picture><source srcset="/brand/logo-horizontal-dark.webp" media="(prefers-color-scheme: dark)" /><img src="/brand/logo-horizontal-light.webp" alt="Práxis — Controle de Processos" /></picture>
      <h1>Sem conexão com a internet</h1>
      <p>O Práxis precisa de conexão para consultar e alterar os dados protegidos no Supabase.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
