<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0A2B52" />
    <title>Práxis — sem conexão</title>
    <style>
      :root{color-scheme:light dark}*{box-sizing:border-box}
      body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(22px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:#F6F9FC;color:#102A4C;font:16px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .card{width:min(460px,100%);padding:32px;border:1px solid #E2EAF1;border-radius:24px;background:#fff;text-align:center;box-shadow:0 18px 54px rgba(6,29,60,.14)}
      .card img{display:block;width:min(270px,78%);height:auto;margin:0 auto 24px;object-fit:contain}
      .card h1{margin:0;color:#102A4C;font-size:1.65rem;letter-spacing:-.5px}.card p{margin:12px 0 20px;color:#6F8298;line-height:1.55}.card small{display:block;margin-top:14px;color:#94A3B8;font-size:.72rem}
      .card button{min-height:48px;border:0;border-radius:13px;padding:12px 20px;background:linear-gradient(135deg,#1F6ED4,#2E82E8);color:white;font:inherit;font-weight:750;cursor:pointer}.card button:focus-visible{outline:2px solid #2E82E8;outline-offset:3px}
      @media(prefers-color-scheme:dark){body{background:#07182D;color:#F3F8FC}.card{background:#0D2543;border-color:#23476A;box-shadow:0 20px 60px rgba(0,0,0,.3)}.card h1{color:#F3F8FC}.card p{color:#9CB2C8}.card small{color:#748DA6}}
    </style>
  </head>
  <body>
    <main class="card">
      <picture><source srcset="/brand/praxis-1-logo-dark.webp" media="(prefers-color-scheme: dark)" /><img src="/brand/praxis-1-logo-light.webp" alt="Práxis" /></picture>
      <h1>Sem conexão disponível</h1>
      <p>Não foi possível carregar a interface pela rede. Tente abrir novamente o Práxis; quando houver dados locais válidos, o modo de contingência será usado pelo aplicativo.</p>
      <button onclick="location.reload()">Tentar novamente</button>
      <small>Práxis 1.0 · o Supabase continua sendo a fonte de verdade.</small>
    </main>
  </body>
</html>
