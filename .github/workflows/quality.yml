name: Qualidade do Práxis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praxis-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipos, testes, auditoria e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Verificar vulnerabilidades de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar versão consolidada
        run: npm run verify:version

      - name: Verificar TypeScript
        run: npm run check

      - name: Executar testes automáticos
        run: npm test

      - name: Compilar aplicação
        run: npm run build

      - name: Publicar artefato da build
        uses: actions/upload-artifact@v7
        with:
          name: praxis-dist-${{ github.sha }}
          path: dist
          retention-days: 14
